version: "1.0.0"
knowledge:
  trusted_sources: [reviewed-repository-instructions, versioned-policy-bundle, reviewed-runtime-contract]
  freshness: reviewed
policy:
  authority_order: [applicable-law-and-platform-controls, explicit-human-authorization, repository-policy, reviewed-runtime-profile]
  fail_closed: true
success:
  acceptance_criteria: [explicit-scope-and-observable-criteria, required-deterministic-validation, traceable-release-decision, no-unresolved-critical-finding]
  required_evidence: [policy-and-runtime-revision, validation-results, release-or-safe-stop-decision]
components:
  deterministic: [admission-and-policy-resolution, scope-and-budget-enforcement, build-test-security-and-contract-validation, release-gating-and-audit-recording]
  generative: [bounded-planning-and-implementation, independent-review-and-remediation-proposals, knowledge-synthesis-with-provenance]

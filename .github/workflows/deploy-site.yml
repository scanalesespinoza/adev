name: Deploy Site

on:
  push:
    branches:
      - main
    paths:
      - 'framework/adevelopment-book/book/**'
      - 'framework/docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'framework/**'
      - 'mkdocs.yml'
      - '.github/workflows/deploy-site.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install MkDocs and Material
        run: pip install mkdocs-material

      - name: Stage Book Content
        run: |
          mkdir -p framework/docs/book
          mkdir -p framework/docs/book/appendices
          # Copy book chapters to docs structure for build
          cp framework/adevelopment-book/book/*.md framework/docs/book/
          cp framework/adevelopment-book/book/appendices/*.md framework/docs/book/appendices/
          
          # Fix relative image links if any (optional, purely precautionary)
          # sed -i 's|\.\./images|../../images|g' framework/docs/book/*.md

      - name: Build documentation
        run: mkdocs build

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        run: mkdocs gh-deploy --force

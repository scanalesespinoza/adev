name: Validate Docs Site

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'adevelopment-book/book/**'
      - '.github/workflows/validate-docs.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'adevelopment-book/book/**'
      - '.github/workflows/validate-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install MkDocs and Material
        run: pip install -r requirements-docs.txt

      - name: Stage book content
        run: |
          mkdir -p docs/book/appendices
          cp adevelopment-book/book/*.md docs/book/
          cp adevelopment-book/book/appendices/*.md docs/book/appendices/

      - name: Build site in strict mode
        run: mkdocs build --strict

name: Validate implementation contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install jsonschema==4.23.0 PyYAML==6.0.2
      - run: python implementation/evaluations/check_repository_layout.py
      - run: python -B implementation/evaluations/test_profile.py
      - run: bash -n bin/adev install/install.sh install/bootstrap.sh
      - run: install/test_install.sh
      - run: install/test_adev.sh

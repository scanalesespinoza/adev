name: Validate Hardness assets

on:
  pull_request:
    paths:
      - 'hardness/**'
      - '.github/workflows/validate-hardness.yml'
  push:
    branches: [main]
    paths:
      - 'hardness/**'
      - '.github/workflows/validate-hardness.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate policy schema fixtures
        run: pwsh -NoProfile -File hardness/scripts/validate-policy-fixtures.ps1

      - name: Validate compatibility surface
        run: pwsh -NoProfile -File hardness/scripts/validate-compatibility-surface.ps1

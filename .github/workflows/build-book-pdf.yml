name: Build ADEV Spanish Book

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
    paths:
      - "adevelopment-book/book-es/**"
      - ".github/workflows/build-book-pdf.yml"
      - "adevelopment-book/README.md"
  pull_request:
    paths:
      - "adevelopment-book/book-es/**"
      - ".github/workflows/build-book-pdf.yml"
      - "adevelopment-book/README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-book:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install publishing toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc epubcheck texlive-xetex texlive-fonts-recommended texlive-latex-recommended texlive-lang-spanish lmodern

      - name: Validate manuscript manifest
        run: |
          test -f adevelopment-book/book-es/Book.txt
          test -f adevelopment-book/book-es/title.txt
          while IFS= read -r entry; do
            [ -z "$entry" ] && continue
            test -f "adevelopment-book/book-es/${entry}.md"
          done < adevelopment-book/book-es/Book.txt

      - name: Build consolidated PDF
        run: |
          mkdir -p adevelopment-book/dist
          BOOK_TITLE="$(cat adevelopment-book/book-es/title.txt)"
          mapfile -t ENTRIES < <(grep -v '^\s*$' adevelopment-book/book-es/Book.txt)
          FILES=()
          for entry in "${ENTRIES[@]}"; do
            FILES+=("adevelopment-book/book-es/${entry}.md")
          done
          pandoc "${FILES[@]}" \
            --resource-path=adevelopment-book/book-es:adevelopment-book/book-es/resources \
            -o adevelopment-book/dist/adev-book.pdf \
            --from markdown-yaml_metadata_block \
            --pdf-engine=xelatex \
            -V geometry=margin=1in \
            -V classoption=onecolumn,titlepage \
            -V fontsize=11pt \
            -V linestretch=1.1 \
            --table-of-contents \
            --toc-depth=2 \
            --metadata title="$BOOK_TITLE" \
            --metadata author="Sergio Sebastián Canales Espinoza" \
            --metadata date="Primera edición en español" \
            --metadata lang="es-ES"

      - name: Build and validate EPUB
        run: |
          BOOK_TITLE="$(cat adevelopment-book/book-es/title.txt)"
          mapfile -t ENTRIES < <(grep -v '^\s*$' adevelopment-book/book-es/Book.txt)
          FILES=()
          for entry in "${ENTRIES[@]}"; do
            FILES+=("adevelopment-book/book-es/${entry}.md")
          done
          pandoc "${FILES[@]}" \
            --resource-path=adevelopment-book/book-es:adevelopment-book/book-es/resources \
            -o adevelopment-book/dist/adev-book.epub \
            --from markdown-yaml_metadata_block \
            --lua-filter=adevelopment-book/epub-external-links.lua \
            --table-of-contents \
            --toc-depth=1 \
            --metadata title="$BOOK_TITLE" \
            --metadata author="Sergio Sebastián Canales Espinoza" \
            --metadata lang="es-ES"
          epubcheck adevelopment-book/dist/adev-book.epub

      - name: Upload PDF artifact (all builds)
        uses: actions/upload-artifact@v4
        with:
          name: adev-book-pdf
          path: adevelopment-book/dist/adev-book.pdf

      - name: Upload EPUB artifact (all builds)
        uses: actions/upload-artifact@v4
        with:
          name: adev-book-epub
          path: adevelopment-book/dist/adev-book.epub

      - name: Publish book formats to GitHub Release (tag builds)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v1
        with:
          files: |
            adevelopment-book/dist/adev-book.pdf
            adevelopment-book/dist/adev-book.epub
          body: "Primera edición en español de ADEV en PDF y EPUB para la versión ${{ github.ref_name }}."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

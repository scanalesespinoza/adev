name: Build A-Dev Book PDF

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
    paths:
      - "adevelopment-book/book/**"
      - "adevelopment-book/book/appendices/**"
      - ".github/workflows/build-book-pdf.yml"
      - "adevelopment-book/README.md"
  pull_request:
    paths:
      - "adevelopment-book/book/**"
      - "adevelopment-book/book/appendices/**"
      - ".github/workflows/build-book-pdf.yml"
      - "adevelopment-book/README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended texlive-latex-recommended lmodern

      - name: Validate manuscript manifest
        run: |
          test -f adevelopment-book/book/Book.txt
          test -f adevelopment-book/book/title.txt
          while IFS= read -r entry; do
            [ -z "$entry" ] && continue
            test -f "adevelopment-book/book/${entry}.md"
          done < adevelopment-book/book/Book.txt

      - name: Build consolidated PDF
        run: |
          mkdir -p adevelopment-book/dist
          BOOK_VERSION="${GITHUB_REF_NAME:-dev}"
          BOOK_TITLE="$(cat adevelopment-book/book/title.txt)"
          mapfile -t ENTRIES < <(grep -v '^\s*$' adevelopment-book/book/Book.txt)
          FILES=()
          for entry in "${ENTRIES[@]}"; do
            FILES+=("adevelopment-book/book/${entry}.md")
          done
          pandoc "${FILES[@]}" \
            --resource-path=adevelopment-book/book:adevelopment-book/book/resources \
            -o adevelopment-book/dist/adev-book.pdf \
            --from markdown-yaml_metadata_block \
            --pdf-engine=xelatex \
            -V geometry=margin=1in \
            -V classoption=onecolumn \
            -V fontsize=11pt \
            -V linestretch=1.1 \
            -V header-includes="\\usepackage[none]{hyphenat}\\usepackage{ragged2e}\\RaggedRight" \
            --table-of-contents \
            --toc-depth=2 \
            --metadata title="$BOOK_TITLE" \
            --metadata author="Sergio Sebastián Canales Espinoza" \
            --metadata date="Version ${BOOK_VERSION}" \
            -V hyphenate=false

      - name: Upload PDF artifact (all builds)
        uses: actions/upload-artifact@v4
        with:
          name: adev-book-pdf
          path: adevelopment-book/dist/adev-book.pdf

      - name: Publish PDF to GitHub Release (tag builds)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v1
        with:
          files: adevelopment-book/dist/adev-book.pdf
          body: "Consolidated A-Dev book PDF for release ${{ github.ref_name }}."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build A-Dev Book PDF

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
    paths:
      - "adevelopment-book/book/**"
      - "adevelopment-book/book/appendices/**"
      - ".github/workflows/build-book-pdf.yml"
  pull_request:
    paths:
      - "adevelopment-book/book/**"
      - "adevelopment-book/book/appendices/**"
      - ".github/workflows/build-book-pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended texlive-latex-recommended lmodern

      - name: Build consolidated PDF
        run: |
          mkdir -p adevelopment-book/dist
          BOOK_VERSION="${GITHUB_REF_NAME:-dev}"
          FILES=(
            adevelopment-book/book/00-title-page.md
            adevelopment-book/book/00-front-matter.md
            adevelopment-book/book/INDEX.md
            adevelopment-book/book/01-adev-manifesto.md
            adevelopment-book/book/02-solo-architect.md
            adevelopment-book/book/03-atomic-iterations.md
            adevelopment-book/book/04-baseline-rules-of-engagement.md
            adevelopment-book/book/05-traceability-digital-thread.md
            adevelopment-book/book/06-quality-density-metrics.md
            adevelopment-book/book/07-weekend-marathon-playbook.md
            adevelopment-book/book/08-homedir-vision.md
            adevelopment-book/book/09-faq-objections.md
            adevelopment-book/book/10-closing.md
            adevelopment-book/book/appendices/A-templates.md
            adevelopment-book/book/appendices/B-glossary.md
            adevelopment-book/book/appendices/C-checklists.md
            adevelopment-book/book/appendices/D-further-reading.md
          )
          pandoc "${FILES[@]}" \
            -o adevelopment-book/dist/adev-book.pdf \
            --from markdown-yaml_metadata_block \
            --pdf-engine=xelatex \
            -V geometry=margin=1in \
            -V classoption=onecolumn \
            -V fontsize=11pt \
            -V linestretch=1.1 \
            -V header-includes="\\usepackage[none]{hyphenat}\\usepackage{ragged2e}\\RaggedRight" \
            --table-of-contents \
            --toc-depth=2 \
            --metadata title="Augmented Development (A-Dev)" \
            --metadata author="Sergio Sebastián Canales Espinoza" \
            --metadata date="Version ${BOOK_VERSION}" \
            -V hyphenate=false

      - name: Upload PDF artifact (non-tag builds)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: adev-book-pdf
          path: adevelopment-book/dist/adev-book.pdf

      - name: Publish PDF to GitHub Release (tag builds)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v1
        with:
          files: adevelopment-book/dist/adev-book.pdf
          body: "Consolidated A-Dev book PDF for release ${{ github.ref_name }}."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

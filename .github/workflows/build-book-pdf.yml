name: Build ADEV Spanish Book

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
    paths:
      - "adevelopment-book/book-es/**"
      - ".github/workflows/build-book-pdf.yml"
      - "adevelopment-book/README.md"
  pull_request:
    paths:
      - "adevelopment-book/book-es/**"
      - ".github/workflows/build-book-pdf.yml"
      - "adevelopment-book/README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-book:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install publishing toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc epubcheck python3-pil fonts-dejavu-core texlive-xetex texlive-fonts-recommended texlive-latex-recommended texlive-lang-spanish lmodern

      - name: Validate manuscript manifest
        run: |
          test -f adevelopment-book/book-es/Book.txt
          test -f adevelopment-book/book-es/title.txt
          test -f adevelopment-book/book-es/version.txt
          BOOK_VERSION="$(cat adevelopment-book/book-es/version.txt)"
          [[ "$BOOK_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          while IFS= read -r entry; do
            [ -z "$entry" ] && continue
            test -f "adevelopment-book/book-es/${entry}.md"
          done < adevelopment-book/book-es/Book.txt

      - name: Validate release identity
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          BOOK_VERSION="$(cat adevelopment-book/book-es/version.txt)"
          EXPECTED_TAG="v${BOOK_VERSION}"
          if [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the canonical book version $EXPECTED_TAG."
            exit 1
          fi

      - name: Compose deterministic cover
        run: |
          mkdir -p adevelopment-book/dist
          python3 adevelopment-book/build-cover.py \
            --input adevelopment-book/book-es/resources/cover-art.png \
            --output adevelopment-book/dist/adev-cover.png

      - name: Build consolidated PDF
        run: |
          mkdir -p adevelopment-book/dist
          BOOK_TITLE="$(cat adevelopment-book/book-es/title.txt)"
          BOOK_VERSION="$(cat adevelopment-book/book-es/version.txt)"
          mapfile -t ENTRIES < <(grep -v '^\s*$' adevelopment-book/book-es/Book.txt)
          FILES=()
          for entry in "${ENTRIES[@]}"; do
            FILES+=("adevelopment-book/book-es/${entry}.md")
          done
          pandoc "${FILES[@]}" \
            --resource-path=adevelopment-book/book-es:adevelopment-book/book-es/resources \
            -o adevelopment-book/dist/adev-book.pdf \
            --from markdown-yaml_metadata_block \
            --pdf-engine=xelatex \
            --include-in-header=adevelopment-book/pdf-cover.tex \
            -V geometry=margin=1in \
            -V classoption=onecolumn,titlepage \
            -V fontsize=11pt \
            -V linestretch=1.1 \
            --table-of-contents \
            --toc-depth=2 \
            --metadata title="$BOOK_TITLE" \
            --metadata author="Sergio Sebastián Canales Espinoza" \
            --metadata date="Primera edición en español" \
            --metadata subject="Primera edición en español · versión ${BOOK_VERSION}" \
            --metadata lang="es-ES"

      - name: Build and validate EPUB
        run: |
          BOOK_TITLE="$(cat adevelopment-book/book-es/title.txt)"
          BOOK_VERSION="$(cat adevelopment-book/book-es/version.txt)"
          mapfile -t ENTRIES < <(grep -v '^\s*$' adevelopment-book/book-es/Book.txt)
          FILES=()
          for entry in "${ENTRIES[@]}"; do
            FILES+=("adevelopment-book/book-es/${entry}.md")
          done
          pandoc "${FILES[@]}" \
            --resource-path=adevelopment-book/book-es:adevelopment-book/book-es/resources \
            -o adevelopment-book/dist/adev-book.epub \
            --from markdown-yaml_metadata_block \
            --lua-filter=adevelopment-book/epub-external-links.lua \
            --epub-cover-image=adevelopment-book/dist/adev-cover.png \
            --table-of-contents \
            --toc-depth=1 \
            --metadata title="$BOOK_TITLE" \
            --metadata author="Sergio Sebastián Canales Espinoza" \
            --metadata identifier="urn:adev:book-es:${BOOK_VERSION}" \
            --metadata lang="es-ES"
          epubcheck adevelopment-book/dist/adev-book.epub

      - name: Upload PDF artifact (all builds)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: adev-book-pdf
          path: adevelopment-book/dist/adev-book.pdf

      - name: Upload EPUB artifact (all builds)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: adev-book-epub
          path: adevelopment-book/dist/adev-book.epub

  publish:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: build-book
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download PDF artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: adev-book-pdf
          path: dist

      - name: Download EPUB artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: adev-book-epub
          path: dist

      - name: Publish book formats to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/adev-book.pdf
            dist/adev-book.epub
          body: "Primera edición en español de ADEV en PDF y EPUB para la versión ${{ github.ref_name }}."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

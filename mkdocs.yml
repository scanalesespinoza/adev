site_name: A-Dev Framework
site_url: https://scanalesespinoza.github.io/adev/
site_description: The A-Dev Framework (Augmented Development) is a discipline-first methodology for practitioners and teams to orchestrate AI-assisted delivery with living baselines, short quality cycles, and strict evidence trails.
site_author: Sergio Sebastián Canales Espinoza

repo_name: scanalesespinoza/adev
repo_url: https://github.com/scanalesespinoza/adev
edit_uri: ""
docs_dir: framework

theme:
  name: material
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: docs/index.md
  - Manifesto: adevelopment-book/book/01-adev-manifesto.md
  - The Framework:
    - Role Shift: adevelopment-book/book/02-solo-architect.md
    - Atomic Iterations: adevelopment-book/book/03-atomic-iterations.md
    - Baseline Rules: adevelopment-book/book/04-baseline-rules-of-engagement.md
    - Traceability: adevelopment-book/book/05-traceability-digital-thread.md
    - Metrics: adevelopment-book/book/06-quality-density-metrics.md
  - Playbook: adevelopment-book/book/07-weekend-marathon-playbook.md
  - Vision: adevelopment-book/book/08-homedir-vision.md
  - Case Studies:
    - EvenFlow Origins: docs/case-studies/evenflow.md
    - Quest Board: docs/case-studies/quest-board.md
    - Live Alpha: docs/case-studies/live-alpha-flags.md
    - The Rollback story: docs/case-studies/rollback.md
  - Extras:
    - FAQ: adevelopment-book/book/09-faq-objections.md
    - Closing: adevelopment-book/book/10-closing.md
    - Appendices:
      - Templates: adevelopment-book/book/appendices/A-templates.md
      - Glossary: adevelopment-book/book/appendices/B-glossary.md
      - Checklists: adevelopment-book/book/appendices/C-checklists.md
      - Further Reading: adevelopment-book/book/appendices/D-further-reading.md
